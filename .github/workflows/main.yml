name: code_room_api_properties
on:
  push:
    branches:
      - production
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar y obtener codigo
        uses: actions/checkout@v4

      - name: Crear carpeta en AWS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.IP_SERVER}}
          username: ${{secrets.USERNAME}}
          key: ${{secrets.KEY}}
          port: ${{secrets.PORT}}
          script: |
            mkdir -p /home/ubuntu/code_room_api_properties

      - name: sincronizar proyecto en el servidor
        uses: burnett01/rsync-deployments@7.0.2
        with:
          switches: "-avz --delete"
          path: "./"
          remote_host: ${{secrets.IP_SERVER}}
          remote_user: ${{secrets.USERNAME}}
          remote_path: "/home/ubuntu/code_room_api_properties"
          remote_key: ${{secrets.KEY}}
          remote_port: ${{secrets.PORT}}

      - name: Instalar Docker y Docker Compose en servidor
        uses: appleboy/ssh-action@v1
        with:
        host: ${{secrets.IP_SERVER}}
        username: ${{secrets.USERNAME}}
        key: ${{secrets.KEY}}
        port: ${{secrets.PORT}}
        script: |
          set -e
          # Instalar Docker si no existe
          # Add Docker's official GPG key:
          sudo apt update -y
          sudo apt install ca-certificates curl -y
          sudo install -m 0755 -d /etc/apt/keyrings
          sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          sudo chmod a+r /etc/apt/keyrings/docker.asc

          # Add the repository to Apt sources:
          sudo tee /etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
          Components: stable
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF

          sudo apt update -y

          #Instalar Docker Packages
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
          docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin -y

          # Asegurar que el servicio esté arriba
          sudo systemctl enable --now docker

          # Grupo docker: no fallar si ya existe
          sudo groupadd docker 2>/dev/null || true
          sudo usermod -aG docker ubuntu || true

          # Verificar instalación
          sudo docker --version
          sudo docker compose version

      - name: Limpiar contenedores y construir imagen
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.IP_SERVER}}
          username: ${{secrets.USERNAME}}
          key: ${{secrets.KEY}}
          port: ${{secrets.PORT}}
          command_timeout: 30m
          script: |
            cd /home/ubuntu/code_room_api_properties

            # Detener contenedores antiguos
            docker compose down || true

            # Limpiar espacio en disco
            echo "Limpiando imágenes antiguas..."
            docker system prune -af --volumes

            # Construir imagen sin cache
            echo "Construyendo imagen Express API Properties..."
            docker compose build --no-cache

            echo "Levantando contenedor..."
            docker compose up -d

            # Esperar 15 segundos para que inicie
            sleep 15

            # Verificar estado
            echo "Estado del contenedor:"
            docker compose ps

            echo "Últimas líneas del log:"
            docker compose logs --tail=50

      - name: Verificar salud del contenedor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{secrets.IP_SERVER}}
          username: ${{secrets.USERNAME}}
          key: ${{secrets.KEY}}
          port: ${{secrets.PORT}}
          script: |
            cd /home/ubuntu/code_room_api_properties

            # Esperar hasta 60 segundos a que el contenedor esté listo
            for i in {1..12}; do
                if docker compose ps | grep -q "Up"; then
                    echo "✅ Contenedor corriendo correctamente"
                    docker compose logs --tail=30
                    
                    # Probar endpoint de health
                    echo "Probando endpoint de salud..."
                    sleep 5
                    curl -f http://localhost:3002/health || echo "⚠️ El servidor aún no responde"
                    
                    exit 0
                fi
                echo "Esperando que el contenedor inicie... ($i/12)"
                sleep 5
            done

            echo "❌ El contenedor no inició correctamente"
            docker compose logs
            exit 1
